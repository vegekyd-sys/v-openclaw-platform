<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>用户用量 · V Platform</title>
    <link rel="stylesheet" href="/style.css" />
    <script defer src="/ui.js"></script>
  </head>
  <body>
    <main>
      <header>
        <div class="wordmark"><b>V</b><span>Platform</span></div>
        <div class="date">
          <label for="range" class="sr">统计时间</label
          ><select id="range">
            <option value="all">整个采集窗口</option>
            <option value="today">今天</option>
            <option value="yesterday">昨天</option>
            <option value="custom">自选日期</option>
          </select>
          <button id="refresh">刷新</button>
        </div>
      </header>
      <div id="dates" hidden>
        <input type="date" id="from" aria-label="开始日期" /> 至
        <input type="date" id="to" aria-label="结束日期" />
      </div>
      <section class="hero">
        <div>
          <h1>用户用量</h1>
          <p id="status" role="status">正在载入数据…</p>
        </div>
      </section>
      <div id="content" hidden>
        <section
          class="metrics"
          aria-label="用户用量摘要"
          id="metrics"
        ></section>
        <section class="sheet" id="people">
          <div class="sectionHead">
            <div>
              <button class="back" id="back" hidden>‹ 返回用户榜</button>
              <h2 id="heading">用户排行</h2>
              <p class="note" id="subtitle"></p>
            </div>
            <div class="controls">
              <input
                type="search"
                id="search"
                placeholder="搜索用户"
                aria-label="搜索用户"
              />
              <details id="refine">
                <summary>筛选</summary>
                <div id="selectors"></div>
              </details>
            </div>
          </div>
          <div id="listhead" class="grid listhead"></div>
          <div id="list"></div>
          <div class="pager">
            <span id="count"></span>
            <div>
              <button id="prev" aria-label="上一页">‹</button
              ><button id="next" aria-label="下一页">›</button>
            </div>
          </div>
        </section>
        <details class="sheet fold" id="attribution">
          <summary>用量归属 <span id="personal-share"></span></summary>
          <div id="coverage"></div>
          <p>
            群聊按触发本次模型调用的发送人归属，沿消息父链或同一运行记录核对。一条响应只计一次。同一个群会话可出现在多人的列表中，每个人只看到自己贡献的用量。
          </p>
        </details>
        <details class="sheet fold" id="analysis">
          <summary>渠道、模型与 Token 明细</summary>
          <div class="switch">
            <label for="groupby">分组</label
            ><select id="groupby">
              <option value="channel">渠道</option>
              <option value="model">模型</option>
              <option value="workload">任务类型</option>
              <option value="session">会话</option>
            </select>
          </div>
          <div id="technical"></div>
        </details>
      </div>
    </main>
  </body>
</html>
