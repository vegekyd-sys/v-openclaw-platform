# V's agent workspace scratch directory: remove what has not changed for 14 days.
# Run daily by the stock systemd-tmpfiles-clean.timer. Approved by Tianyi 2026-11-07.
#
# Age is judged by mtime/ctime for files and creation/mtime for directories only
# ("cmBM:"), never by access time: agents' recursive searches re-read the whole
# tree and relatime refreshes atime every 24 h, so the default "abcmABM" never
# lets anything here expire (2026-11-07: 8.8 GB unchanged for 14+ days, all read
# within the last two days). ctime keeps a fresh unzip with old mtimes alive.
# `e` only cleans: it never creates the directory or changes its owner or mode.
e /home/openclaw/makaron-openclaw/.openclaw-local/workspace/tmp - - - cmBM:14d
