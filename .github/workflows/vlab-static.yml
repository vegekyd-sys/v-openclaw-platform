name: vLab static checks

on:
  pull_request:
  push:
    branches:
      # dev is where work actually lands, so it is where a red build has to be
      # visible. Until 2026-09-23 this ran only on pull_request and push-to-main,
      # and main had not moved since 2026-08-23 -- so a break on dev could sit
      # unnoticed, which is exactly what happened to the worker plugin version
      # assertion in tests/vlab-agent-worker-static.sh.
      - dev
      - main

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    # 5 -> 8 on 2026-11-10: the first `captured-store link` of a fresh clone
    # builds the shared cache and copies every capture's dist/.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      # Version from package.json "packageManager".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # release/captured/*/dist is not on dev since 2026-11-10: the bytes are on
      # the captured-store branch, linked in by path (docs/release-captured-store.md).
      # check fails a branch that commits dist/ again or forgets to publish it.
      - name: Link captured runtime bytes
        run: |
          git fetch --no-tags origin +refs/heads/captured-store:refs/remotes/origin/captured-store
          node scripts/captured-store.mjs link --no-fetch
          node scripts/captured-store.mjs check --no-fetch
      - name: Test platform catalog
        run: pnpm test
      # Night Shift moved to vegekyd-sys/v-nightshift on 2026-10-02; the
      # Workboard dist patches it relies on stay here with their tests.
      - name: Test Workboard dist patches
        run: node --test tests/workboard-*-patch.test.mjs
      - name: Validate vLab release assets
        run: ./tests/vlab-static.sh
      # Every OpenClaw byte V runs that differs from upstream must map to a
      # source commit, so an upgrade is a rebase instead of re-deriving dist
      # patches (docs/upgrade-lts/patch-catch-up-plan.md, step 0).
      - name: Check captured runtime maps to source
        run: |
          node --test tests/check-source-map.test.mjs
          node scripts/check-source-map.mjs --report
