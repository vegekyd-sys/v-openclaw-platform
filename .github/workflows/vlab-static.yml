name: vLab static checks

on:
  pull_request:
  push:
    branches:
      # dev is where work actually lands, so it is where a red build has to be
      # visible. Until 2026-09-23 this ran only on pull_request and push-to-main,
      # and main had not moved since 2026-08-23 -- so a break on dev could sit
      # unnoticed, which is exactly what happened to the worker plugin version
      # assertion in tests/vlab-agent-worker-static.sh.
      - dev
      - main

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test platform catalog
        run: npm test
      # Night Shift moved to vegekyd-sys/v-nightshift on 2026-10-02; the
      # Workboard dist patches it relies on stay here with their tests.
      - name: Test Workboard dist patches
        run: node --test tests/workboard-*-patch.test.mjs
      - name: Validate vLab release assets
        run: ./tests/vlab-static.sh
