# Drop-in for the Gateway unit: where the channels (v-experience) ask v-secret-entry for a
# one-time credential link. Gateway and Worker children inherit it. Without it, DingTalk,
# WeCom and Telegram fall back to "cannot enter credentials here" + cancel.
# Takes effect at the next Gateway start; scripts/install-secret-entry-host.sh renders it.
[Service]
Environment=V_SECRET_ENTRY_ADMIN_URL=http://127.0.0.1:23961
Environment=V_SECRET_ENTRY_ADMIN_TOKEN_FILE=/etc/v-secret-entry/admin-token
