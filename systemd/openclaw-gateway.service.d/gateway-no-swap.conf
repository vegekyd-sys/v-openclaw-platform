# Drop-in for the Gateway unit: keep the Gateway's and its Workers' memory out of swap.
# A full V8 GC marks every live object; when the kernel has swapped out cold pages of the
# Gateway's old generation, that GC faults them back one page at a time and stops the Gateway
# for 46-70 s with almost no CPU (V 2026-10-16, docs/gateway-freeze-20261016.md). Page cache
# charged to the unit (agent database reads) remains reclaimable, and other services may still
# swap. MemoryHigh/MemoryMax are unchanged.
[Service]
MemorySwapMax=0
