# Drop-in for the Gateway unit: capacity limits that let V survive a long uptime and recover
# from an unclean exit (docs/incidents/2026-11-26-gateway-tasks-max-crash-loop.md).
#
# TasksMax: the base unit allows 4096 tasks (processes + threads). Every Codex thread and every
# Gateway session keeps its MCP servers (node, npx, ssh) alive until the thread ends, and V
# Browser adds Chrome. On 2026-11-26 after 16.5 h of uptime the unit hit 4096, `spawn` failed
# with EAGAIN and the Gateway exited.
#
# OPENCLAW_DB91_PREFLIGHT_TIMEOUT_MS: after an unclean exit the DB91 preflight checks all 8 agent
# databases in full before admitting the Gateway. With the makaron database at 49 GB that took
# 716 s, past the 300 s default; the timeout itself exits uncleanly, so V restarted every 5 min
# and never came up. One hour leaves room for the databases to keep growing.
[Service]
TasksMax=16384
Environment=OPENCLAW_DB91_PREFLIGHT_TIMEOUT_MS=3600000
