# Drop-in for the Gateway unit (restart-speed release, docs/v-restart-speed.md).
#
# OPENCLAW_DB91_RESTART_CARRY=1: after a clean restart on the same host boot, an agent
# database whose last full check is still valid in the previous lifecycle is not read again
# in full before admission (V: 22 GB, ~110 s). Crash, reboot, revocation, expiry (26 h) or a
# changed file still get the full check before admission.
#
# ProtectControlGroups=no: the native integrity verifier (5 min after start, then daily)
# moves itself into the delegated cgroup this unit already declares (94-verifier-resource-
# group: Delegate=memory, DelegateSubgroup=foreground). With the base unit's
# ProtectControlGroups=yes the cgroup tree is read-only and every run since at least
# 2026-10-05 failed with EROFS, so V only checked its databases at startup. The service user
# can write only its own delegated subtree. Shared VLab already runs with "no".
[Service]
Environment=OPENCLAW_DB91_RESTART_CARRY=1
ProtectControlGroups=no
