# Drop-in for the Gateway unit: before every start, remove Codex app-server
# registrations whose parent and child processes are both gone, so the new Gateway's
# reaper does not fail turns with "Cannot reap registered Codex process <pid>".
# Runs as the service user (the state database belongs to it). The script always
# exits 0 and writes one JSON line to the journal ("event":"codex-orphan-cleanup").
[Service]
ExecStartPre=/usr/bin/python3 /opt/v-ops/codex-orphan-cleanup.py
